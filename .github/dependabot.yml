version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  # upstream/ is moved deliberately by scripts/sync-upstream.sh after the
  # patch series is rebased, so the submodule is not auto-bumped.
