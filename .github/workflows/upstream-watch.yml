name: upstream-watch

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - name: Compare pinned and latest upstream tags
        id: cmp
        run: |
          git -C upstream fetch --tags --quiet origin
          pinned=$(git -C upstream describe --tags --exact-match 2>/dev/null || git -C upstream rev-parse --short HEAD)
          latest=$(git -C upstream tag --list 'v*' --sort=-v:refname | head -n1)
          # Upstream tag names are third-party input: accept strict SemVer tags only.
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$latest" =~ $semver ]] || { echo "::error::unexpected upstream tag name"; exit 1; }
          [[ "$pinned" =~ $semver || "$pinned" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::unexpected pinned ref"; exit 1; }
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Trial-apply patches on latest tag
        if: steps.cmp.outputs.pinned != steps.cmp.outputs.latest
        id: trial
        continue-on-error: true
        env:
          LATEST: ${{ steps.cmp.outputs.latest }}
        run: scripts/sync-upstream.sh "$LATEST"
      - name: Open tracking issue
        if: steps.cmp.outputs.pinned != steps.cmp.outputs.latest
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.cmp.outputs.latest }}
          PINNED: ${{ steps.cmp.outputs.pinned }}
          TRIAL: ${{ steps.trial.outcome }}
        run: |
          title="Upstream Rayhunter $LATEST available (pinned: $PINNED)"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length' | grep -qx 0; then
            gh issue create --title "$title" --label upstream \
              --body "Patch series trial-apply on $LATEST: **$TRIAL**. See docs/PATCH-POLICY.md for the rebase procedure."
          fi
