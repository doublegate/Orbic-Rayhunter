name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build
        required: true

permissions:
  contents: write

# Must match ci.yml: rust-cache hashes CARGO_* variables into its cache key.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Stage patched upstream (needed for cache keys)
        run: scripts/apply-patches.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: build/rayhunter/package-lock.json
      # Restore-only: release builds reuse main's caches but never write them.
      # Each restore mirrors its ci.yml producer exactly (shared-key, workspace and
      # the workflow-level CARGO_* env), or the cache keys never match.
      # The root rust-toolchain.toml pins the same 1.98.0 as upstream, so the
      # upstream install below also serves the orx build. orx-cli has no dependencies and CI's host-crates cache holds only dev/test
      # artifacts, so it is not restored here (a second rust-cache step would also
      # re-extract ~/.cargo/registry over the first).
      - name: Restore rustup toolchain + armv7 target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
          key: rustup-${{ runner.os }}-${{ hashFiles('build/rayhunter/rust-toolchain.toml') }}-armv7
      - name: Install upstream toolchain + armv7 target
        working-directory: build/rayhunter
        run: rustup toolchain install && rustup target add armv7-unknown-linux-musleabihf
      - name: Restore patched-upstream cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: patched
          workspaces: build/rayhunter -> target
          save-if: false
      - name: Build orx (host, x86_64 linux)
        run: cargo build --release --locked -p orx-cli
      - name: Build patched daemon + rootshell
        run: scripts/build.sh devel
      - name: Stage assets
        run: |
          cp target/release/orx dist/orx-x86_64-linux
          cd dist
          rm -f SHA256SUMS
          sha256sum -- ./* > ../SHA256SUMS.tmp
          mv ../SHA256SUMS.tmp SHA256SUMS
      - name: Build release notes (CHANGELOG section + technical appendix)
        # Release notes are the human-written CHANGELOG section for this version
        # followed by an auto-generated, technically detailed appendix (asset table
        # with per-file SHA-256 and target, build provenance, and pointers). Every
        # release is therefore comprehensive without hand-assembly.
        run: |
          ver="${TAG#v}"
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > body.md
          test -s body.md || echo "See CHANGELOG.md for details." > body.md
          upstream_tag=$(git -C upstream describe --tags --always 2>/dev/null || echo unknown)
          upstream_sha=$(git -C upstream rev-parse --short HEAD 2>/dev/null || echo unknown)
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' build/rayhunter/rust-toolchain.toml | head -1)
          {
            cat body.md
            echo
            echo "## Release assets"
            echo
            echo "| Asset | Target / role | Size | SHA-256 |"
            echo "|---|---|---|---|"
            while read -r sum path; do
              f="${path#./}"
              case "$f" in
                orx-*linux*)       role="host CLI (\`orx\`), x86_64 Linux" ;;
                rayhunter-daemon)  role="device daemon, armv7 musleabihf" ;;
                rootshell)         role="device root helper, armv7 musleabihf" ;;
                *)                 role="-" ;;
              esac
              sz=$(stat -c%s "dist/$f")
              echo "| \`$f\` | $role | $sz B | \`$sum\` |"
            done < dist/SHA256SUMS
            echo
            echo "\`SHA256SUMS\` lists these hashes; verify with \`sha256sum -c SHA256SUMS\` in the download directory."
            echo
            echo "## Build provenance"
            echo
            echo "- Tagged commit: \`${GITHUB_SHA:-$TAG}\`"
            echo "- Upstream pin: EFForg/rayhunter \`$upstream_tag\` (\`$upstream_sha\`)"
            echo "- Rust toolchain: \`${toolchain:-see rust-toolchain.toml}\`"
            echo "- Built reproducibly by \`.github/workflows/release.yml\` on ubuntu-24.04."
            echo
            echo "## Pointers"
            echo
            echo "- Install, scope and current state: \`INSTALL.md\`, \`PROJECT-STATUS.md\` at this tag."
            echo "- Backup/recovery and device safety: \`docs/BACKUP-AND-RECOVERY.md\`, \`docs/SECURITY-MODEL.md\`."
            echo "- Full change history: \`CHANGELOG.md\`."
          } > notes.md
      - name: Create or update release (never duplicates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Orbic-Rayhunter $TAG" --notes-file notes.md
          fi
