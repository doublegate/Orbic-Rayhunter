name: security

# gitleaks runs on every event (it is fast, and a secret can land in any file).
# cargo-audit and CodeQL are path-aware: skipped (still reporting as passing
# for required checks) unless their inputs changed, and always run on the
# weekly schedule so newly published advisories and queries are picked up.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Unique name, listed as a required check in the `main` ruleset: if change
    # detection fails, its dependents are skipped (which would otherwise read as
    # passing), so this check must fail closed and block the merge itself.
    name: detect changes (security)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deps: ${{ steps.f.outputs.deps }}
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only push/PR have a meaningful diff; schedule and dispatch run every job
      # through the event_name clauses in each job's `if:`.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: f
        with:
          filters: |
            deps:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**/Cargo.toml'
              - '.github/workflows/security.yml'
            code:
              - 'crates/**'
              - 'Cargo.toml'
              - '.github/**'

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache gitleaks binary
        id: gl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-8.30.1-linux-x64
      - name: Download gitleaks (pinned)
        if: steps.gl.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C ~/.local/bin gitleaks
      - name: gitleaks
        run: ~/.local/bin/gitleaks git --redact --verbose .

  cargo-audit:
    needs: changes
    if: needs.changes.outputs.deps == 'true' || (github.event_name != 'push' && github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    needs: changes
    if: needs.changes.outputs.code == 'true' || (github.event_name != 'push' && github.event_name != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: actions, rust
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
