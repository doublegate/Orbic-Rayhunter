<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" width="1440" height="540" role="img" aria-labelledby="roadmap-title roadmap-desc">
  <title id="roadmap-title">Orbic-Rayhunter Release Roadmap</title>
  <desc id="roadmap-desc">Horizontal release roadmap from v0.1.0 Foundation through v1.0.0 Baseline and v2.0.0 Enhanced.</desc>

  <!-- Deep navy background -->
  <rect x="0" y="0" width="1440" height="540" fill="#0b1020"/>

  <!-- Subtle radar sweep arcs in top-right -->
  <g stroke="#22d3ee" stroke-opacity="0.1" fill="none" stroke-width="1.5">
    <circle cx="1380" cy="48" r="65"/>
    <circle cx="1380" cy="48" r="110"/>
    <circle cx="1380" cy="48" r="155"/>
  </g>
  <circle cx="1282" cy="92" r="4" fill="#f59e0b" fill-opacity="0.8"/>

  <!-- Title and Legend -->
  <text x="44" y="46" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0.3">Orbic-Rayhunter Release Roadmap</text>
  <text x="44" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">Incremental milestone progression from initial foundation and baseline parity to enhanced capabilities</text>

  <!-- Legend badges -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12">
