    <text x="1022" y="56" fill="#94a3b8">Release Milestone</text>
    <circle cx="1156" cy="52" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="1170" y="56" fill="#ffffff" font-weight="600">Major Milestone (v1.0.0 / v2.0.0)</text>
  </g>

