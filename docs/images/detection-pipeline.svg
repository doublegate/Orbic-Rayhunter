<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 480" width="1320" height="480" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">Orbic-Rayhunter Detection Pipeline</title>
  <desc id="pipeline-desc">Left-to-right passive detection pipeline from Modem DIAG log stream through QMDL recording, Parser (LTE RRC / NAS), Analyzers, Warning (debounced), and Web UI / display / ntfy.</desc>
  <defs>
    <marker id="pipe-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="pipe-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <marker id="pipe-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Deep navy background -->
  <rect x="0" y="0" width="1320" height="480" fill="#0b1020"/>

  <!-- Subtle background radar waves -->
  <g stroke="#22d3ee" stroke-opacity="0.1" fill="none" stroke-width="1.5">
    <circle cx="1260" cy="60" r="70"/>
    <circle cx="1260" cy="60" r="115"/>
    <circle cx="1260" cy="60" r="160"/>
  </g>
  <circle cx="1155" cy="105" r="4" fill="#f59e0b" fill-opacity="0.75"/>

  <!-- Header -->
  <text x="36" y="46" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="0.3">Passive Heuristic Detection Pipeline</text>
  <text x="36" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">Baseband diagnostic telemetry flow from Qualcomm MDM9207 DIAG stream to operator alerts</text>

  <!-- Stage 1: Modem DIAG log stream -->
  <rect x="32" y="196" width="172" height="96" rx="10" fill="#131d36" stroke="#22d3ee" stroke-width="1.75"/>
  <circle cx="52" cy="216" r="4.5" fill="#22d3ee"/>
  <text x="118" y="242" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Modem DIAG</text>
  <text x="118" y="262" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">log stream</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="204" y1="244" x2="236" y2="244" stroke="#22d3ee" stroke-width="2.25" marker-end="url(#pipe-cyan)"/>

  <!-- Stage 2: QMDL recording -->
  <rect x="240" y="196" width="168" height="96" rx="10" fill="#131d36" stroke="#22d3ee" stroke-width="1.75"/>
  <circle cx="260" cy="216" r="4.5" fill="#22d3ee"/>
  <text x="324" y="248" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700">QMDL recording</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="408" y1="244" x2="440" y2="244" stroke="#22d3ee" stroke-width="2.25" marker-end="url(#pipe-cyan)"/>

  <!-- Stage 3: Parser (LTE RRC / NAS) -->
  <rect x="444" y="196" width="184" height="96" rx="10" fill="#131d36" stroke="#22d3ee" stroke-width="1.75"/>
  <circle cx="464" cy="216" r="4.5" fill="#22d3ee"/>
  <text x="536" y="242" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700">Parser</text>
  <text x="536" y="262" text-anchor="middle" fill="#22d3ee" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">(LTE RRC / NAS)</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="628" y1="244" x2="660" y2="244" stroke="#22d3ee" stroke-width="2.25" marker-end="url(#pipe-cyan)"/>

  <!-- Stage 4: Analyzers (stacked box with the 6 analyzers) -->
  <rect x="664" y="96" width="236" height="332" rx="12" fill="#121b31" stroke="#f59e0b" stroke-width="2"/>
  <rect x="664" y="96" width="236" height="42" rx="12" fill="#1d2842"/>
  <rect x="664" y="126" width="236" height="12" fill="#1d2842"/>
  <circle cx="688" cy="117" r="5" fill="#f59e0b"/>
  <text x="782" y="122" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700">Analyzers</text>

  <!-- Stacked analyzer items (exact spelling required) -->
  <!-- 1: IMSI requested -->
  <rect x="680" y="148" width="204" height="36" rx="6" fill="#17233f" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.55"/>
  <circle cx="696" cy="166" r="3.5" fill="#f59e0b"/>
  <text x="710" y="171" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">IMSI requested</text>

  <!-- 2: 2G downgrade redirect -->
  <rect x="680" y="192" width="204" height="36" rx="6" fill="#17233f" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.55"/>
  <circle cx="696" cy="210" r="3.5" fill="#f59e0b"/>
  <text x="710" y="215" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">2G downgrade redirect</text>

  <!-- 3: SIB6/7 downgrade -->
  <rect x="680" y="236" width="204" height="36" rx="6" fill="#17233f" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.55"/>
  <circle cx="696" cy="254" r="3.5" fill="#f59e0b"/>
  <text x="710" y="259" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">SIB6/7 downgrade</text>

  <!-- 4: null cipher -->
  <rect x="680" y="280" width="204" height="36" rx="6" fill="#17233f" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.55"/>
  <circle cx="696" cy="298" r="3.5" fill="#f59e0b"/>
  <text x="710" y="303" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">null cipher</text>

  <!-- 5: NAS null cipher -->
  <rect x="680" y="324" width="204" height="36" rx="6" fill="#17233f" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.55"/>
  <circle cx="696" cy="342" r="3.5" fill="#f59e0b"/>
  <text x="710" y="347" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">NAS null cipher</text>

  <!-- 6: incomplete SIB -->
  <rect x="680" y="368" width="204" height="36" rx="6" fill="#17233f" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.55"/>
  <circle cx="696" cy="386" r="3.5" fill="#f59e0b"/>
  <text x="710" y="391" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">incomplete SIB</text>

  <!-- Arrow 4 -> 5 -->
  <line x1="900" y1="244" x2="932" y2="244" stroke="#f59e0b" stroke-width="2.25" marker-end="url(#pipe-amber)"/>

  <!-- Stage 5: Warning (debounced) -->
  <rect x="936" y="196" width="164" height="96" rx="10" fill="#1a1c2e" stroke="#f59e0b" stroke-width="1.75"/>
  <circle cx="956" cy="216" r="4.5" fill="#f59e0b"/>
  <text x="1018" y="242" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700">Warning</text>
  <text x="1018" y="262" text-anchor="middle" fill="#f59e0b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">(debounced)</text>

  <!-- Arrow 5 -> 6 -->
  <line x1="1100" y1="244" x2="1132" y2="244" stroke="#22c55e" stroke-width="2.25" marker-end="url(#pipe-green)"/>

  <!-- Stage 6: Web UI / display / ntfy -->
  <rect x="1136" y="196" width="152" height="96" rx="10" fill="#122432" stroke="#22c55e" stroke-width="1.75"/>
  <circle cx="1156" cy="216" r="4.5" fill="#22c55e"/>
  <text x="1212" y="242" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Web UI / display</text>
  <text x="1212" y="262" text-anchor="middle" fill="#22c55e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">/ ntfy</text>
</svg>
